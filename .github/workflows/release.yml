name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish:
    name: Publish (${{ matrix.artifact }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows-x64
            args: --bundles nsis
          - os: macos-latest
            artifact: macos-universal
            args: --target universal-apple-darwin --bundles dmg
          - os: ubuntu-24.04
            artifact: linux-x64
            args: --bundles appimage,deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install macOS targets
        if: matrix.os == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev \
            libpulse-dev \
            libssl-dev \
            build-essential \
            curl \
            wget \
            file

      - name: Install JS dependencies
        run: npm ci

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "LiveTranslate ${{ github.ref_name }}"
          releaseBody: |
            LiveTranslate is a real-time system-audio translator powered by Gemini Live Translate.

            - Windows: NSIS installer
            - macOS 13+: universal DMG (arm64 + Intel). Grant Screen Recording permission on first run.
            - Linux: AppImage and .deb. Requires PulseAudio or PipeWire (and libpulse).

            The builds are unsigned. On macOS, right-click the app and choose Open. On Windows, SmartScreen may ask for confirmation.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
