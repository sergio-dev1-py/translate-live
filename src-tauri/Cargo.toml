[package]
name = "live-translate"
version = "0.1.0"
description = "Traducción de voz en tiempo real con Gemini Live Translate"
authors = ["LiveTranslate contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.85"

[lib]
name = "live_translate_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
base64 = "0.22"
cpal = "0.18"
reqwest = { version = "0.12", features = ["rustls-tls", "json"] }
url = "2"
dirs = "6"
anyhow = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
parking_lot = "0.12"
keyring = "4"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Media_Audio",
  "Win32_Devices_Properties",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_System_Variant",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_Foundation",
] }

[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = "1.5"

[target.'cfg(target_os = "linux")'.dependencies]
cpal = { version = "0.18", features = ["pulseaudio"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
